[package]
name = "aegis-desktop"
version = "0.1.0"
description = "Aegis Desktop — Local CoW Sandbox Workbench & Dual-Surface Writing Studio"
edition = "2021"

[lib]
name = "aegis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
