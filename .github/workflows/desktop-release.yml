name: Aegis Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      aegis_os_tag:
        description: Pinned aegis-os release tag to bundle as sidecar
        required: true
        default: v0.12.3

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies & run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test
          pnpm --filter @aegis/desktop build

      - name: Download pinned aegis-os sidecar & verify SHA-256
        env:
          AEGIS_OS_TAG: ${{ inputs.aegis_os_tag || 'v0.12.3' }}
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          ASSET="aegis-os-${AEGIS_OS_TAG}-${{ matrix.target }}.tar.gz"
          BASE_URL="https://github.com/${{ github.repository_owner }}/aegis-os/releases/download/${AEGIS_OS_TAG}"
          curl -fsSL "${BASE_URL}/${ASSET}" -o "/tmp/${ASSET}"
          curl -fsSL "${BASE_URL}/SHA256SUMS" -o /tmp/SHA256SUMS
          (
            cd /tmp
            if command -v sha256sum >/dev/null 2>&1; then
              grep "  ${ASSET}\$" SHA256SUMS | sha256sum -c -
            else
              grep "  ${ASSET}\$" SHA256SUMS | shasum -a 256 -c -
            fi
          )
          tar -xzf "/tmp/${ASSET}" -C /tmp
          cp /tmp/aegis-os "apps/desktop/src-tauri/binaries/aegis-os-${{ matrix.target }}"
          chmod +x "apps/desktop/src-tauri/binaries/aegis-os-${{ matrix.target }}"

      - name: Configure optional Apple signing environment
        if: runner.os == 'macOS'
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$(printf '%s' "${_APPLE_CERTIFICATE}" | tr -d '[:space:]')" ]; then
            echo "Apple signing certificate detected; exporting APPLE_* signing environment."
            {
              echo "APPLE_CERTIFICATE<<__AEGIS_ENV_EOF__"
              printf '%s\n' "${_APPLE_CERTIFICATE}"
              echo "__AEGIS_ENV_EOF__"
            } >> "$GITHUB_ENV"
            if [ -n "${_APPLE_CERTIFICATE_PASSWORD}" ]; then
              {
                echo "APPLE_CERTIFICATE_PASSWORD<<__AEGIS_ENV_EOF__"
                printf '%s\n' "${_APPLE_CERTIFICATE_PASSWORD}"
                echo "__AEGIS_ENV_EOF__"
              } >> "$GITHUB_ENV"
            fi
            if [ -n "${_APPLE_SIGNING_IDENTITY}" ]; then
              echo "APPLE_SIGNING_IDENTITY=${_APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
            fi
            if [ -n "${_APPLE_ID}" ]; then
              echo "APPLE_ID=${_APPLE_ID}" >> "$GITHUB_ENV"
            fi
            if [ -n "${_APPLE_PASSWORD}" ]; then
              {
                echo "APPLE_PASSWORD<<__AEGIS_ENV_EOF__"
                printf '%s\n' "${_APPLE_PASSWORD}"
                echo "__AEGIS_ENV_EOF__"
              } >> "$GITHUB_ENV"
            fi
            if [ -n "${_APPLE_TEAM_ID}" ]; then
              echo "APPLE_TEAM_ID=${_APPLE_TEAM_ID}" >> "$GITHUB_ENV"
            fi
          else
            echo "APPLE_CERTIFICATE secret not configured; skipping Apple codesign/notarization."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Aegis Desktop v__VERSION__'
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: --target ${{ matrix.target }}
